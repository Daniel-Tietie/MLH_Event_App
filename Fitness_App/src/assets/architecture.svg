<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="614" viewBox="20 90 1160 614" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#23262d"/>
    </marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e223c" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="20" y="90" width="1160" height="614" fill="#f1f2f7"/>

  <!-- Users -->
  <g filter="url(#sh)">
    <rect x="40" y="250" width="170" height="150" rx="18" fill="#fff" stroke="#23262d" stroke-width="1.5"/>
  </g>
  <g transform="translate(106,262) scale(1.5833333333333333)" fill="none" stroke="#6b3ff2" stroke-width="1.14" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></g>
  <text x="125" y="330" text-anchor="middle" font-size="16" font-weight="800" fill="#16181d">Players &amp; hosts</text>
  <text x="125" y="352" text-anchor="middle" font-size="12.5" fill="#7b8196">Phone or laptop browser</text>
  <text x="125" y="372" text-anchor="middle" font-size="12.5" fill="#7b8196">(responsive web app)</text>

  <!-- App -->
  <g filter="url(#sh)">
    <rect x="270" y="170" width="280" height="310" rx="18" fill="#fff" stroke="#23262d" stroke-width="1.5"/>
  </g>
  <rect x="270" y="170" width="280" height="46" rx="18" fill="#f6d56a"/>
  <rect x="270" y="196" width="280" height="20" fill="#f6d56a"/>
  <text x="410" y="200" text-anchor="middle" font-size="16" font-weight="800" fill="#16181d">Rally web app</text>
  <text x="290" y="244" font-size="12.5" font-weight="700" fill="#7b8196">REACT 18 + VITE</text>
  <g font-size="13.5" fill="#16181d">
    <text x="290" y="272">• Explore, Nearby, Calendar</text>
    <text x="290" y="296">• Host an event, Event page</text>
    <text x="290" y="320">• Live safety (radar, SOS)</text>
    <text x="290" y="344">• Friends &amp; Messages</text>
    <text x="290" y="368">• Profile &amp; private details</text>
  </g>
  <line x1="290" y1="388" x2="530" y2="388" stroke="#e6e8f0"/>
  <text x="290" y="412" font-size="12.5" font-weight="700" fill="#7b8196">SERVICES LAYER</text>
  <text x="290" y="436" font-size="13" fill="#16181d">supabase-js client, weather,</text>
  <text x="290" y="456" font-size="13" fill="#16181d">recommendations, geo helpers</text>

  <!-- Supabase container -->
  <rect x="620" y="110" width="540" height="440" rx="22" fill="#efe9ff" stroke="#6b3ff2" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="644" y="142" font-size="16" font-weight="800" fill="#6b3ff2">Supabase (backend)</text>

  <!-- Postgres (big) -->
  <g filter="url(#sh)">
    <rect x="644" y="160" width="492" height="196" rx="16" fill="#fff" stroke="#23262d" stroke-width="1.5"/>
  </g>
  <g transform="translate(664,175) scale(0.8333333333333334)" fill="none" stroke="#6b3ff2" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></g>
  <text x="692" y="191" font-size="15" font-weight="800" fill="#16181d">Postgres + PostGIS</text>
  <text x="664" y="212" font-size="12.5" fill="#7b8196">Profiles, events, participants, waitlist, follows, messages, photos</text>
  <rect x="664" y="226" width="226" height="116" rx="12" fill="#f6f7fb"/>
  <text x="678" y="250" font-size="12.5" font-weight="800" fill="#6b3ff2">ROW-LEVEL SECURITY</text>
  <g font-size="12.5" fill="#16181d">
    <text x="678" y="272">• Photos &amp; chat: members only</text>
    <text x="678" y="292">• DMs: the two people only</text>
    <text x="678" y="312">• DOB &amp; gender: owner only</text>
    <text x="678" y="332">• QR tokens never exposed</text>
  </g>
  <rect x="900" y="226" width="222" height="116" rx="12" fill="#f6f7fb"/>
  <text x="914" y="250" font-size="12.5" font-weight="800" fill="#6b3ff2">DATABASE FUNCTIONS</text>
  <g font-size="12.5" fill="#16181d">
    <text x="914" y="272">• Join, cap &amp; waitlist promote</text>
    <text x="914" y="292">• Pro requests &amp; approvals</text>
    <text x="914" y="312">• Show-up score, eligibility</text>
    <text x="914" y="332">• Friends-only messaging</text>
  </g>

  <!-- Auth / Storage / Realtime -->
  <g filter="url(#sh)">
    <rect x="644" y="376" width="152" height="152" rx="16" fill="#fff" stroke="#23262d" stroke-width="1.5"/>
    <rect x="814" y="376" width="152" height="152" rx="16" fill="#fff" stroke="#23262d" stroke-width="1.5"/>
    <rect x="984" y="376" width="152" height="152" rx="16" fill="#fff" stroke="#23262d" stroke-width="1.5"/>
  </g>
  <g transform="translate(686,395) scale(0.75)" fill="none" stroke="#6b3ff2" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g>
  <text x="731" y="410" text-anchor="middle" font-size="15" font-weight="800" fill="#16181d">Auth</text>
  <g font-size="12.5" fill="#7b8196" text-anchor="middle">
    <text x="720" y="436">Sign-up &amp; login</text>
    <text x="720" y="456">Sessions</text>
    <text x="720" y="476">18+ at sign-up</text>
  </g>
  <g transform="translate(842,395) scale(0.75)" fill="none" stroke="#6b3ff2" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"/></g>
  <text x="901" y="410" text-anchor="middle" font-size="15" font-weight="800" fill="#16181d">Storage</text>
  <g font-size="12.5" fill="#7b8196" text-anchor="middle">
    <text x="890" y="436">Profile pictures</text>
    <text x="890" y="456">Event photos</text>
    <text x="890" y="476">(private, signed links)</text>
  </g>
  <g transform="translate(1008,395) scale(0.75)" fill="none" stroke="#6b3ff2" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></g>
  <text x="1071" y="410" text-anchor="middle" font-size="15" font-weight="800" fill="#16181d">Realtime</text>
  <g font-size="12.5" fill="#7b8196" text-anchor="middle">
    <text x="1060" y="436">Group chat</text>
    <text x="1060" y="456">Direct messages</text>
    <text x="1060" y="476">Safety pings &amp; SOS</text>
  </g>

  <!-- External services -->
  <g filter="url(#sh)">
    <rect x="270" y="600" width="280" height="84" rx="14" fill="#fff" stroke="#23262d" stroke-width="1.5"/>
    <rect x="570" y="600" width="280" height="84" rx="14" fill="#fff" stroke="#23262d" stroke-width="1.5"/>
    <rect x="870" y="600" width="290" height="84" rx="14" fill="#fff" stroke="#23262d" stroke-width="1.5"/>
  </g>
  <g transform="translate(290,617) scale(0.75)" fill="none" stroke="#6b3ff2" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round"><path d="M14.1 6.3 9.9 4.2a2 2 0 0 0-1.8 0L3.6 6.4A1 1 0 0 0 3 7.3v12.4a1 1 0 0 0 1.4.9l3.7-1.8a2 2 0 0 1 1.8 0l4.2 2.1a2 2 0 0 0 1.8 0l4.5-2.2a1 1 0 0 0 .6-.9V4.4a1 1 0 0 0-1.4-.9l-3.7 1.8a2 2 0 0 1-1.8 0z"/><path d="M15 5.8v15"/><path d="M9 3.2v15"/></g>
  <text x="316" y="632" font-size="14.5" font-weight="800" fill="#16181d">Maps</text>
  <text x="290" y="656" font-size="12.5" fill="#7b8196">Leaflet + CARTO / OpenStreetMap tiles</text>
  <g transform="translate(590,617) scale(0.75)" fill="none" stroke="#6b3ff2" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></g>
  <text x="616" y="632" font-size="14.5" font-weight="800" fill="#16181d">Place search</text>
  <text x="590" y="656" font-size="12.5" fill="#7b8196">Nominatim (OpenStreetMap geocoding)</text>
  <g transform="translate(890,617) scale(0.75)" fill="none" stroke="#6b3ff2" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="M20 12h2"/><path d="m19.07 4.93-1.41 1.41"/><path d="M15.95 12.65a4 4 0 0 0-5.61-5.1"/><path d="M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z"/></g>
  <text x="916" y="632" font-size="14.5" font-weight="800" fill="#16181d">Weather</text>
  <text x="890" y="656" font-size="12.5" fill="#7b8196">Open-Meteo hourly forecast at event time</text>

  <!-- Arrows -->
  <line x1="212" y1="325" x2="266" y2="325" stroke="#23262d" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="552" y1="258" x2="640" y2="258" stroke="#23262d" stroke-width="2" marker-end="url(#arr)"/>
  <text x="584" y="248" text-anchor="middle" font-size="11.5" fill="#7b8196">supabase-js</text>
  <line x1="552" y1="310" x2="640" y2="430" stroke="#23262d" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="410" y1="482" x2="410" y2="596" stroke="#23262d" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M410,570 L1015,570" fill="none" stroke="#23262d" stroke-width="2"/>
  <line x1="710" y1="570" x2="710" y2="596" stroke="#23262d" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="1015" y1="570" x2="1015" y2="596" stroke="#23262d" stroke-width="2" marker-end="url(#arr)"/>
  <circle cx="410" cy="570" r="4" fill="#23262d"/>
